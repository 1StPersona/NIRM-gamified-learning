name: CI

on:
  push:
  pull_request:

jobs:
  # ---------- Continuous Integration ----------
  test:
    name: CI — тесты и проверки
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.0
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: Сборка (компиляция модулей)
        run: python -m compileall -q gamification services simulation bench
      - name: Модульные и интеграционные тесты
        run: pytest -v --junitxml=test-report.xml
      - name: Воспроизводимость симуляции (короткий прогон, фиксированный seed)
        run: python -m simulation.simulate --seed 42 --reps 1 --out /tmp/simulation.csv
      - name: Микробенчмарк (регрессия производительности, только отчёт)
        run: python -m bench.micro
      - name: Отчёт о статусе
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: |
            test-report.xml
            bench/results/micro.json

  # ---------- Continuous Delivery (только тестовая среда) ----------
  deploy-staging:
    name: CD — деплой в staging
    needs: test                 # запускается только после успешного CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging        # production не используется
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка артефакта (Docker-образ)
        run: |
          docker build -t gamification:${GITHUB_SHA::7} .
          docker save gamification:${GITHUB_SHA::7} | gzip > image.tar.gz
          ls -lh image.tar.gz
      - name: Деплой в тестовую среду
        run: IMAGE_TAG=${GITHUB_SHA::7} docker compose -f deploy/staging.yml -p staging up -d
      - name: Проверка запуска приложения (smoke-тест)
        run: bash deploy/smoke.sh http://localhost:8080
      - name: Логи тестовой среды
        if: always()
        run: docker compose -f deploy/staging.yml -p staging logs --no-color > staging.log; cat staging.log
      - name: Сохранение артефактов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.sha }}
          path: |
            image.tar.gz
            staging.log
          retention-days: 7
      - name: Остановка тестовой среды
        if: always()
        run: docker compose -f deploy/staging.yml -p staging down
