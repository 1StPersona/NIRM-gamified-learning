name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.0
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Модульные и интеграционные тесты
        run: pytest -v
      - name: Воспроизводимость симуляции (короткий прогон, фиксированный seed)
        run: python -m simulation.simulate --seed 42 --reps 1 --out /tmp/simulation.csv
      - name: Микробенчмарк (регрессия производительности, только отчёт)
        run: python -m bench.micro
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/micro.json
